project:
  type: website
  # The blog and the About page are built by Quarto. The home page, the project
  # pages and the guide are finished HTML files and are copied to the site as they are.
  render:
    - blog.qmd
    - about.qmd
    - "posts/*/index.qmd"
    - "posts/**/*.ipynb"
  resources:
    - index.html
    - og-image.png
    - airfoil-cfd-surrogate-drl.html
    - airfoil-rom-betavae-design.html
    - physics-informed-pinn-deeponet.html
    - unet-turbulent-fields.html
    - rom-ladle-digital-twin.html
    - cfd-signal-forecasting-rnn-transformer.html
    - latent-dynamics-ae-vae-koopman.html
    - wall-shear-to-near-wall-velocity.html
    - diffusion-channel-flow-fields.html
    - "guides/*.html"

website:
  title: "Vamsi Gudipati"
  description: "Machine learning for simulation: projects, guides and notes on scientific machine learning and CFD."
  site-url: https://vamsigudipati.github.io
  open-graph:
    image: og-image.png
  navbar:
    title: "Vamsi Gudipati"
    right:
      - text: Projects
        href: index.html#projects
      - text: Guides
        href: index.html#guides
      - text: Code
        href: index.html#code
      - text: Blog
        href: blog.qmd
      - text: About
        href: about.qmd
      - text: GitHub
        href: https://github.com/vamsigudipati
      - icon: rss
        href: blog.xml
  page-footer: "© 2026 Vamsi Gudipati"

format:
  html:
    theme:
      light: [cosmo, brand-light.scss]
      dark: [darkly, brand-dark.scss]
    css: styles.css
    toc: true
    code-copy: true
    code-overflow: wrap
    link-external-newwindow: true

execute:
  freeze: auto
